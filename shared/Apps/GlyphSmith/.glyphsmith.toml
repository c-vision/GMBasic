# .glyphsmith.toml — GlyphSmith — configurazione della app
# ============================================================================
# Tutto si configura QUI (la app non riceve argv: BASIC non ha argv).
#   [settings] mode: status | check | sheet | edit | import | textin | tui
#   [source]   bdf
#   [output]   dir, bmp_scale, cells_per_row
#   [edit]     script   (solo in mode = "edit")
#   [import]   font, size, first, last, threshold, out   (solo in mode = "import")
#   [text]     source, out                              (solo in mode = "textin")
#   [bmpin]    source, scale, cols, cellw, cellh, first, trim, out  (mode = "bmpin")
#   [tui]      keys, render                            (solo in mode = "tui")
# ============================================================================

[settings]
# fallback quando il run non porta un simbolo -DGLYPHSMITH_MODE_*
mode = "check"

[source]
# sorgente BDF, relativa alla cartella della app
bdf = "fixtures/mini8.bdf"

[output]
# cartella degli artefatti (creata se assente); vuota = app dir / "bin"
dir = "bin"
# ingrandimento dei pixel nel foglio BMP
bmp_scale = 4
# glifi per riga nel foglio BMP
cells_per_row = 8

[edit]
# script di editing batch (un comando per riga), relativo alla cartella della app
script = "edits/demo.txt"

[import]
# font outline (TrueType/OpenType) da convertire in BDF; relativo alla cartella
# della app, oppure assoluto.
font = "/System/Library/Fonts/Supplemental/Andale Mono.ttf"
# corpo in pixel
size = 16
# intervallo di codepoint (inclusivo), limitato a 0..65535
first = 32
last = 126
# soglia di copertura 0..255 sopra la quale il pixel diventa '1'
threshold = 128
# nome del BDF prodotto (dentro [output] dir)
out = "imported.bdf"

[text]
# bitmap testuale (ASCII art) da importare; relativo alla cartella della app, o assoluto.
# Il formato e' quello prodotto dall'app stessa in [output] dir: "mini8.ascii".
source = "bin/mini8.ascii"
# nome del BDF prodotto (dentro [output] dir)
out = "from_text.bdf"

[tui]
# script di tasti (un tasto per riga, '#' = commento), relativo alla cartella della app
keys = "edits/keys.txt"
# "1" = stampa il frame dopo ogni tasto, "0" = solo quello iniziale e quello finale
render = "0"
# BDF scritto all'uscita (dentro [output] dir): la TUI non butta il lavoro
out = "tui.bdf"

[bmpin]
# Foglio BMP 24-bit da importare come font (griglia di celle); relativo alla
# cartella della app, oppure assoluto. Il formato e' quello scritto da [output]
# (sheet.bmp) oppure una griglia compatibile: solo 24 bit, BI_RGB, non compresso.
source = "bin/sheet.bmp"
# pixel del BMP per pixel del glifo (il foglio scritto con bmp_scale = 4 va letto con 4)
scale = 4
# celle per riga: devono essere quelle con cui il foglio e' stato scritto
# (per sheet.bmp: [output] cells_per_row). 0 = deriva da cellw.
cols = 3
# lato della cella in pixel del BMP; 0 = deriva da cols (cellw = larghezza / cols)
cellw = 0
# altezza della cella in pixel del BMP; 0 = uguale a cellw
cellh = 0
# encoding del primo glifo importato (poi +1 per ogni cella NON vuota: le celle
# vuote vengono saltate, il foglio non porta gli encoding). I glifi sono alti al
# massimo 32 righe (limite GS_ROWS).
first = 65
# "1" = ritaglia i margini bianchi della cella (righe/colonne tutte bianche);
# "0" = tiene l'intera cella. Il foglio non registra le metriche per glifo:
# con il ritaglio larghezza/altezza sono quelle dell'inchiostro.
trim = "1"
# nome del BDF prodotto (dentro [output] dir)
out = "from_bmp.bdf"
