# .webapp.toml — configurazione della WEBAPP (Agents Operating Center)
# ============================================================================
# Tutto si configura QUI (nessun parametro nel codice). Il file è cercato nella
# cartella della app e poi risalendo fino a 4 livelli; se manca valgono i default.
#
# Chiavi riconosciute:
#   [server] dashboardPort, apiPort, allowedIPs, sessions
#   [app]    seedDemo, autoTrace, refreshMs
#   [paths]  pages, static            (relativi alla cartella della app)
# ============================================================================

[server]
# Pagine BSP + statici + proxy /api/* + WebSocket /ws/canvas
dashboardPort = 8090
# AI AGENT SERVE (API JSON degli agenti)
apiPort       = 8765
# Console locale: solo loopback. "" = nessun filtro (NON consigliato).
allowedIPs    = "127.0.0.1"
# Sessioni HTTP (cookie GMBSESSION) — servono a eventuali middleware/CSRF futuri.
sessions      = true
# Rate limit del server dashboard (richieste/minuto; 0 = nessun limite).
# Il DEFAULT del runtime è 60/min con burst 120: per una console locale con polling è
# troppo basso (un browser con 2-3 tab arriva a 60+/min e riceve 429). Qui è disattivato;
# alzalo se esponi la dashboard in LAN.
rateLimitPerMinute = 0
rateLimitBurst     = 0
# Memoizzazione della resa delle pagine BSP (ms; 0 = disattivata). Il costo per richiesta è
# l'ESECUZIONE della pagina: con più tab/client in polling la stessa resa viene riusata per
# questa finestra (e servita con ETag/304). Con refreshMs 2500, 1000 ms è un buon compromesso.
bspCacheMs = 1000

# Motore BSP: "managed" (VM P-Code/IL in-process) oppure "c" (VM/C via P/Invoke, libgmb_bsp).
# I due motori sono ALLINEATI: lo stato di agenti/team/workflow/memoria è UNO SOLO — la VM/C
# lo legge/scrive attraverso l'hook opzionale (gmb_state_hook.h) che delega alle stesse API
# che usa il managed. Verificato: index.bsp resa identica byte-per-byte dai due motori.
# Il motore C è più veloce sulle pagine con dati (index.bsp: ~8-13x a cache spenta).
bspEngine = "c"
# Pagine da forzare sulla VM/C anche con bspEngine="managed" (vuoto = nessuna eccezione).
bspEnginePages = ""

# Pagine che il motore C può renderizzare in PARALLELO (lock di lettura): vale solo per pagine
# il cui stato passa INTERAMENTE dal client managed (hook) — nessuno stato C condiviso.
# Tutte le altre restano serializzate. Vedi Knowledge/BSP-Engine-Audit-Concorrenza.
bspConcurrentPages = "index.bsp,canvas.bsp,wasm.bsp"

[app]
# Crea Demo/Analyst/Support se il registry degli agenti è vuoto.
seedDemo  = true
# AI AGENT TRACE VERBOSE all'avvio: popola la tab Log.
autoTrace = true
# Polling delle tab (millisecondi; 0 = solo refresh manuale).
refreshMs = 2500

[paths]
# Relativi alla cartella della app (PROJECTFOLDER), non alla CWD.
pages  = "pages"
static = "static"
